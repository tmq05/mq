version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mq-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: mq_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/prisma/init-unaccent.sql:/docker-entrypoint-initdb.d/init-unaccent.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d mq_db']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mq-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: mq-server
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: 'postgresql://postgres:postgrespassword@postgres:5432/mq_db?schema=public'
      REDIS_URL: 'redis://redis:6379'
      JWT_ACCESS_SECRET: 'mq_super_secure_jwt_access_secret_key_2026_production'
      JWT_REFRESH_SECRET: 'mq_super_secure_jwt_refresh_secret_key_2026_production'
      JWT_ACCESS_EXPIRES_IN: '15m'
      JWT_REFRESH_EXPIRES_IN: '7d'
      COOKIE_SECURE: 'false'
      CLIENT_URL: 'http://localhost:3000'
      STORAGE_TYPE: 'local'
      UPLOAD_DIR: './uploads'
      AUDIUS_ENABLED: 'true'
      JAMENDO_ENABLED: 'true'
      JAMENDO_CLIENT_ID: 'c8f13b19'
      YOUTUBE_ENABLED: 'true'
      YOUTUBE_API_KEY: ''
      DEEZER_ENABLED: 'true'
      ITUNES_ENABLED: 'true'
      LRCLIB_ENABLED: 'true'
    ports:
      - '5000:5000'
    volumes:
      - server_uploads:/app/server/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: mq-client
    restart: always
    ports:
      - '3000:80'
    depends_on:
      - server

volumes:
  postgres_data:
  redis_data:
  server_uploads:

